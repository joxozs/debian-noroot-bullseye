name: build-debian11-noroot-rootfs

on:
  workflow_dispatch: {}

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout debian-noroot (com submódulos)
        uses: actions/checkout@v4
        with:
          repository: pelya/debian-noroot
          submodules: recursive

      - name: Instalar dependências de build (README oficial do pelya)
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake debhelper build-essential \
            libtool qemu-user-static debootstrap schroot apt-cacher-ng \
            git wget xz-utils
          # pxz pode não existir no Ubuntu; xz-utils cobre a compressão se faltar
          sudo apt-get install -y pxz || echo "pxz indisponível, seguiremos com xz-utils"

      - name: Confirmar binfmt para arm64 (necessário pro qemu-debootstrap)
        run: |
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64 || \
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Gerar script bullseye a partir do buster (mesmo patch que já validamos no Termux)
        working-directory: img
        run: |
          cp img-debian-buster-arm64-v8a.sh img-debian-bullseye-arm64-v8a.sh
          sed -i 's/buster/bullseye/g' img-debian-bullseye-arm64-v8a.sh
          sed -i 's#ftp.de.debian.org#archive.debian.org#' img-debian-bullseye-arm64-v8a.sh
          sed -i '/APT_CACHER=\/localhost:3142/d' img-debian-bullseye-arm64-v8a.sh
          sed -i 's/qemu-debootstrap --arch=arm64 --verbose/qemu-debootstrap --arch=arm64 --verbose --no-check-gpg/' img-debian-bullseye-arm64-v8a.sh
          sed -i 's/apt-get update/apt-get update -o Acquire::Check-Valid-Until=false/' img-debian-bullseye-arm64-v8a.sh
          cp img-debian-buster.pkg img-debian-bullseye.pkg
          cat > sources-jessie.list << 'EOF'
          deb [trusted=yes] http://archive.debian.org/debian jessie main contrib non-free
          EOF
          cat img-debian-bullseye-arm64-v8a.sh

      - name: Rodar debootstrap real (root de verdade, chroot real — sem as limitações do Android)
        working-directory: img
        run: sudo ./img-debian-bullseye-arm64-v8a.sh

      - name: Compilar libandroid-shmem-disableselinux.so dentro do chroot (passo oficial do README)
        run: |
          sudo mount -o bind . img/dist-debian-bullseye-arm64-v8a/img/mnt
          sudo chroot img/dist-debian-bullseye-arm64-v8a/img /bin/sh -c "
            apt-get update -o Acquire::Check-Valid-Until=false &&
            apt-get install -y gcc &&
            cd /mnt &&
            ./build.sh
          "

      - name: Empacotar overlay final
        working-directory: img
        run: |
          chmod +x prepare-img-overlay.sh 2>/dev/null || true
          sudo ./prepare-img-overlay.sh || echo "AVISO: prepare-img-overlay.sh falhou ou tem uso diferente — ver log acima, vamos ajustar"

      - name: Listar o que foi gerado (pra conferência)
        run: |
          find img/dist-debian-bullseye-arm64-v8a -maxdepth 2 -type f -o -maxdepth 2 -type d | head -50
          du -sh img/dist-debian-bullseye-arm64-v8a/* 2>/dev/null || true

      - name: Compactar rootfs pronto
        run: |
          cd img
          tar -I 'xz -T0' -cvf dist-debian-bullseye-arm64-v8a.tar.xz dist-debian-bullseye-arm64-v8a

      - name: Publicar como artifact (pra baixar depois no Termux)
        uses: actions/upload-artifact@v4
        with:
          name: debian-bullseye-arm64-v8a-rootfs
          path: img/dist-debian-bullseye-arm64-v8a.tar.xz
          retention-days: 14
